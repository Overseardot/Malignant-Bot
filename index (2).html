<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniChess</title>
<style>
  :root {
    --board: min(92vw, 520px);
    --sq: calc(var(--board) / 8);
    --light: #f0d9b5;
    --dark: #b58863;
    --bg: #f6f4f0;
    --fg: #222;
    --muted: #666;
    --btn: #e4e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1d1f; --fg: #eee; --muted: #aaa; --btn: #3a3a3e; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  h1 { font-size: 1.25rem; margin: 4px 0 0; }
  #status { min-height: 1.4em; font-weight: 600; text-align: center; }
  #board {
    width: var(--board); height: var(--board);
    display: grid; grid-template-columns: repeat(8, 1fr);
    border: 2px solid #5a4632; user-select: none; -webkit-user-select: none;
  }
  .sq {
    position: relative; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--sq) * 0.78); line-height: 1; cursor: pointer;
  }
  .sq.light { background-color: var(--light); }
  .sq.dark  { background-color: var(--dark); }
  .sq.last  { background-image: linear-gradient(rgba(255, 235, 59, .45), rgba(255, 235, 59, .45)); }
  .sq.sel   { background-image: linear-gradient(rgba(70, 150, 255, .55), rgba(70, 150, 255, .55)); }
  .sq.check { background-image: radial-gradient(circle, rgba(230, 0, 0, .75), rgba(230, 0, 0, 0) 75%); }
  .sq.target::after {
    content: ""; position: absolute; width: 28%; height: 28%; border-radius: 50%;
    background: rgba(20, 120, 60, .5); pointer-events: none;
  }
  .sq.target.cap::after {
    width: 88%; height: 88%; background: transparent; border: 4px solid rgba(20, 120, 60, .6);
  }
  .piece.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 1px 1px #000; }
  .piece.b { color: #111; text-shadow: 0 0 1px rgba(255, 255, 255, .6); }
  .coord {
    position: absolute; font-size: calc(var(--sq) * 0.17); font-weight: 700;
    opacity: .7; pointer-events: none; line-height: 1; color: #3b2a1a;
  }
  .coord.rank { top: 3px; left: 3px; }
  .coord.file { bottom: 2px; right: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  label { font-size: .9rem; color: var(--muted); }
  select, button {
    font: inherit; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #0003; background: var(--btn); color: var(--fg); cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #promo { padding: 8px 12px; border-radius: 8px; background: var(--btn); }
  #moves {
    width: var(--board); font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .8rem; color: var(--muted); word-break: break-word; min-height: 2.4em;
  }
  #err {
    width: var(--board); padding: 10px 12px; border-radius: 8px;
    background: #fde8e8; color: #7a1010; font-size: .85rem;
  }
  #err code { display: block; margin-top: 6px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
  <h1>MiniChess</h1>
  <div id="status">Loading engine…</div>
  <div id="board"></div>

  <div id="promo" class="row" hidden>
    <span>Promote to:</span>
    <button id="promo-q">Queen</button>
    <button id="promo-r">Rook</button>
    <button id="promo-b">Bishop</button>
    <button id="promo-n">Knight</button>
    <button id="promo-x">Cancel</button>
  </div>

  <div class="row">
    <label>Play as
      <select id="side"><option value="w">White</option><option value="b">Black</option></select>
    </label>
    <label>Think time
      <select id="time">
        <option value="300">0.3 s</option>
        <option value="1000" selected>1 s</option>
        <option value="3000">3 s</option>
        <option value="8000">8 s</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button id="new">New game</button>
    <button id="undo">Undo</button>
    <button id="flip">Flip board</button>
  </div>

  <div id="moves"></div>

  <div id="err" hidden></div>

  <!-- Produced by: emcc wasm_api.cpp ... (see the top of wasm_api.cpp) -->
  <script src="engine.js"></script>
  <script>
(function () {
  'use strict';

  var START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  var GLYPH = { k: '\u265A', q: '\u265B', r: '\u265C', b: '\u265D', n: '\u265E', p: '\u265F' };
  var BUILD_CMD = 'emcc wasm_api.cpp -std=c++17 -O2 -o engine.js -sMODULARIZE=1 -sEXPORT_NAME=createEngine ' +
                  '-sSINGLE_FILE=1 -sALLOW_MEMORY_GROWTH=1 -sEXPORTED_RUNTIME_METHODS=ccall';

  function $(id) { return document.getElementById(id); }
  var boardEl = $('board'), statusEl = $('status'), movesEl = $('moves'), promoEl = $('promo');
  var raf = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : function (f) { setTimeout(f, 16); };

  // ---- game state (the page owns it; the engine only ever sees a FEN) ----
  var M = null;                 // the loaded engine module
  var human = 'w';              // which colour the person plays
  var flipped = false;
  var busy = false;             // true while the engine is thinking
  var over = false;
  var fen = START;
  var last = null;              // {from, to} of the last move, for highlighting
  var inCheck = false;
  var selected = -1;            // selected square index (a1 = 0 ... h8 = 63)
  var legal = [];               // legal moves in the current position, e.g. ["e2e4", ...]
  var pending = null;           // a promotion waiting for the person to pick a piece
  var stack = [{ fen: START, last: null, move: null }];   // one snapshot per ply, for Undo
  var statusText = '';
  var token = 0;                // bumped on new game / undo so stale engine replies are ignored

  // ---- thin wrappers over the C++ engine ----
  function call(name, ret, types, args) { return M.ccall(name, ret, types, args); }
  function legalMoves(f) { return call('engine_legal_moves', 'string', ['string'], [f]).split(' ').filter(Boolean); }
  function applyMove(f, mv) { return call('engine_apply_move', 'string', ['string', 'string'], [f, mv]); }
  function bestMove(f, ms) { return call('engine_best_move', 'string', ['string', 'number'], [f, ms]); }
  function statusOf(f) { return call('engine_status', 'string', ['string'], [f]); }

  // ---- small helpers ----
  function sqName(i) { return 'abcdefgh'.charAt(i & 7) + (1 + (i >> 3)); }
  function sqIndex(name) { return (name.charCodeAt(0) - 97) + 8 * (name.charCodeAt(1) - 49); }
  function fromOf(mv) { return sqIndex(mv.slice(0, 2)); }
  function toOf(mv) { return sqIndex(mv.slice(2, 4)); }

  function parseFen(f) {
    var parts = f.split(' '), board = [], i;
    for (i = 0; i < 64; i++) board.push('');
    parts[0].split('/').forEach(function (row, r) {
      var file = 0;
      row.split('').forEach(function (ch) {
        if (ch >= '1' && ch <= '8') file += Number(ch);
        else { board[(7 - r) * 8 + file] = ch; file++; }
      });
    });
    return { board: board, turn: parts[1] };
  }

  function isMine(p) { return p !== '' && ((p === p.toUpperCase()) === (human === 'w')); }

  // ---- drawing ----
  function render() {
    var st = parseFen(fen), board = st.board;
    var targets = {};
    legal.forEach(function (mv) { if (selected >= 0 && fromOf(mv) === selected) targets[toOf(mv)] = true; });
    var kingSq = -1;
    if (inCheck) kingSq = board.indexOf(st.turn === 'w' ? 'K' : 'k');

    boardEl.textContent = '';
    for (var row = 0; row < 8; row++) {
      for (var col = 0; col < 8; col++) {
        (function (sq, row, col) {
          var cls = ['sq', ((sq >> 3) + (sq & 7)) % 2 === 0 ? 'dark' : 'light'];
          if (last && (sq === last.from || sq === last.to)) cls.push('last');
          if (sq === selected) cls.push('sel');
          if (sq === kingSq) cls.push('check');
          if (targets[sq]) { cls.push('target'); if (board[sq]) cls.push('cap'); }
          var el = document.createElement('div');
          el.className = cls.join(' ');
          var p = board[sq];
          if (p) {
            var span = document.createElement('span');
            span.className = 'piece ' + (p === p.toUpperCase() ? 'w' : 'b');
            span.textContent = GLYPH[p.toLowerCase()] + '\uFE0E';
            el.appendChild(span);
          }
          if (col === 0) {
            var rk = document.createElement('span');
            rk.className = 'coord rank';
            rk.textContent = String((sq >> 3) + 1);
            el.appendChild(rk);
          }
          if (row === 7) {
            var fl = document.createElement('span');
            fl.className = 'coord file';
            fl.textContent = 'abcdefgh'.charAt(sq & 7);
            el.appendChild(fl);
          }
          el.addEventListener('click', function () { onSquare(sq); });
          boardEl.appendChild(el);
        })(flipped ? row * 8 + (7 - col) : (7 - row) * 8 + col, row, col);
      }
    }

    statusEl.textContent = statusText;
    movesEl.textContent = stack.slice(1).map(function (s) { return s.move; }).join(' ');
    promoEl.hidden = !pending;
    $('undo').disabled = busy || stack.length < 2;
  }

  // ---- game flow ----
  function afterMove() {
    legal = legalMoves(fen);
    var st = statusOf(fen), turn = parseFen(fen).turn;
    inCheck = (st === 'check');
    over = true;
    if (st === 'checkmate') statusText = (turn === human) ? 'Checkmate \u2014 the engine wins.' : 'Checkmate \u2014 you win!';
    else if (st === 'stalemate') statusText = 'Stalemate \u2014 draw.';
    else if (st === 'draw-50') statusText = 'Draw by the fifty-move rule.';
    else if (st === 'draw-material') statusText = 'Draw \u2014 not enough material to mate.';
    else {
      over = false;
      var prefix = inCheck ? 'Check \u2014 ' : '';
      statusText = (turn === human) ? prefix + 'your move.' : prefix + 'engine is thinking\u2026';
      if (turn === human) statusText = statusText.charAt(0).toUpperCase() + statusText.slice(1);
    }
    render();
    if (!over && turn !== human) engineTurn();
  }

  function commit(mv) {
    var next = applyMove(fen, mv);
    if (!next) return false;
    fen = next;
    last = { from: fromOf(mv), to: toOf(mv) };
    stack.push({ fen: fen, last: last, move: mv });
    afterMove();
    return true;
  }

  function engineTurn() {
    busy = true;
    render();
    var ms = Number($('time').value) || 1000, mine = ++token;
    // let the browser paint "thinking" before the search blocks the page
    raf(function () {
      setTimeout(function () {
        if (mine !== token) return;
        var mv = bestMove(fen, ms);
        busy = false;
        if (mv) commit(mv); else afterMove();
      }, 0);
    });
  }

  function onSquare(sq) {
    if (!M || busy || over || pending) return;
    var st = parseFen(fen);
    if (st.turn !== human) return;
    if (selected >= 0) {
      var cands = legal.filter(function (mv) { return fromOf(mv) === selected && toOf(mv) === sq; });
      if (cands.length === 1) { selected = -1; commit(cands[0]); return; }
      if (cands.length > 1) { pending = { from: selected, to: sq }; render(); return; }   // promotion
    }
    selected = (isMine(st.board[sq]) && sq !== selected) ? sq : -1;
    render();
  }

  function newGame() {
    token++;
    busy = false; over = false; pending = null; selected = -1; inCheck = false;
    human = $('side').value;
    flipped = (human === 'b');
    fen = START; last = null;
    stack = [{ fen: START, last: null, move: null }];
    afterMove();
  }

  function undo() {
    if (!M || busy || stack.length < 2) return;
    token++;
    pending = null; selected = -1;
    do { stack.pop(); } while (stack.length > 1 && parseFen(stack[stack.length - 1].fen).turn !== human);
    fen = stack[stack.length - 1].fen;
    last = stack[stack.length - 1].last;
    afterMove();
  }

  function showError(msg) {
    var e = $('err');
    e.hidden = false;
    e.textContent = msg + ' Build it with:';
    var code = document.createElement('code');
    code.textContent = BUILD_CMD;
    e.appendChild(code);
    statusEl.textContent = 'Engine not loaded.';
  }

  // ---- wiring ----
  $('new').addEventListener('click', function () { if (M) newGame(); });
  $('undo').addEventListener('click', undo);
  $('flip').addEventListener('click', function () { flipped = !flipped; render(); });
  ['q', 'r', 'b', 'n'].forEach(function (p) {
    $('promo-' + p).addEventListener('click', function () {
      if (!pending) return;
      var mv = sqName(pending.from) + sqName(pending.to) + p;
      pending = null; selected = -1;
      commit(mv);
    });
  });
  $('promo-x').addEventListener('click', function () { pending = null; selected = -1; render(); });

  if (typeof createEngine !== 'function') {
    showError('engine.js was not found next to this page.');
    render();
    return;
  }
  createEngine().then(function (mod) {
    M = mod;
    newGame();
  }).catch(function (err) {
    showError('The engine failed to start (' + err + ').');
  });
})();
  </script>
</body>
</html>
